const { TokenCard, DashedInfoCard, GlassCircle, GlassPill, StripedPlaceholder } = window.MyReciBookDesignSystem_4222aa;
function Demo() {

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
        <TokenCard padding={14}>
