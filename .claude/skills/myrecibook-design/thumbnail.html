<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;width:1280px;height:854px;overflow:hidden}
.tile{display:flex;width:1280px;height:854px}
.main{flex:1;background:#24389c;display:flex;align-items:center;justify-content:center}
.name{font-family:var(--font-display);font-weight:800;font-size:118px;letter-spacing:-0.02em;color:#ffffff;white-space:nowrap}
.strip{width:25%;display:flex;flex-direction:column}
.strip div{flex:1}
</style>
</head>
<body>
<div class="tile">
<div class="main"><div class="name">MyReciBook</div></div>
<div class="strip">
<div style="background:#abb7ff"></div>
<div style="background:#3f51b5"></div>
<div style="background:#b40050"></div>
<div style="background:#88003b"></div>
</div>
</div>
</body>
</html>
