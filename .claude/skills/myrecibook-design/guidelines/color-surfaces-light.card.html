<!-- @dsCard group="Colors" viewport="700x200" name="Surfaces — light “Stitch Slate”" subtitle="Warm cream scaffold, cool container ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;font-family:var(--font-body)}
.row{display:flex;gap:8px}
.sw{flex:1;height:96px;border-radius:12px;border:1px solid var(--hairline);padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between}
.n{font-size:11px;font-weight:600;color:var(--on-surface)}.h{font-size:10.5px;color:var(--on-surface-variant);font-family:var(--font-mono)}
.foot{margin-top:10px;display:flex;gap:16px;font-size:11.5px;color:var(--on-surface-variant);align-items:center}
.ln{display:inline-block;width:56px;height:1px;background:var(--outline-variant);vertical-align:middle}
</style></head>
<body>
<div class="row">
<div class="sw" style="background:var(--scaffold)"><span class="n">scaffold</span><span class="h">#FAF8F0 cream</span></div>
<div class="sw" style="background:var(--surface)"><span class="n">surface</span><span class="h">#F9F9FC</span></div>
<div class="sw" style="background:var(--surface-container-lowest)"><span class="n">lowest · cards</span><span class="h">#FFFFFF</span></div>
<div class="sw" style="background:var(--surface-container-low)"><span class="n">low</span><span class="h">#F3F3F6</span></div>
<div class="sw" style="background:var(--surface-container)"><span class="n">container · search</span><span class="h">#EEEEF0</span></div>
<div class="sw" style="background:var(--surface-container-high)"><span class="n">high · chips</span><span class="h">#E8E8EA</span></div>
<div class="sw" style="background:var(--surface-container-highest)"><span class="n">highest</span><span class="h">#E2E2E5</span></div>
</div>
<div class="foot"><span>on-surface #1A1C1E</span><span>on-surface-variant #454652</span><span>outline #757684</span><span><span class="ln"></span> hairline = outline-variant @50%</span></div>
</body></html>
