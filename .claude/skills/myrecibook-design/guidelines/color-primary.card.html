<!-- @dsCard group="Colors" viewport="700x170" name="Primary — Moody Blue" subtitle="M3 pairs from the #3F51B5 seed" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;display:flex;gap:10px}
.sw{flex:1;height:132px;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--font-body)}
.n{font-size:12.5px;font-weight:600}.h{font-size:11px;opacity:.75;font-family:var(--font-mono)}</style></head>
<body>
<div class="sw" style="background:var(--primary);color:var(--on-primary)"><span class="n">--primary</span><span class="h">#24389C</span></div>
<div class="sw" style="background:var(--primary-container);color:var(--on-primary-container)"><span class="n">--primary-container</span><span class="h">#3F51B5</span></div>
<div class="sw" style="background:var(--inverse-primary);color:#071a86"><span class="n">--inverse-primary</span><span class="h">#BAC3FF · dark primary</span></div>
<div class="sw" style="background:var(--surface-tint);color:#fff"><span class="n">--surface-tint</span><span class="h">#4355B9</span></div>
</body></html>
