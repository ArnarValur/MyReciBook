<!-- @dsCard group="Spacing" viewport="700x190" name="Spacing scale" subtitle="4px grid · 20px screen padding · 12px card gap" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;font-family:var(--font-body)}
.r{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.bar{height:16px;background:var(--secondary-container);border-radius:4px}
.t{font-family:var(--font-mono);font-size:11px;color:var(--on-surface-variant);width:150px}
.foot{margin-top:10px;font-size:11.5px;color:var(--on-surface-variant)}
</style></head>
<body>
<div class="r"><span class="t">xs 4</span><span class="bar" style="width:4px"></span></div>
<div class="r"><span class="t">sm 8 · chip gaps</span><span class="bar" style="width:8px"></span></div>
<div class="r"><span class="t">compact 12 · card gap</span><span class="bar" style="width:12px"></span></div>
<div class="r"><span class="t">md 16 · base padding</span><span class="bar" style="width:16px"></span></div>
<div class="r"><span class="t">screen-pad 20</span><span class="bar" style="width:20px;background:var(--primary)"></span></div>
<div class="r"><span class="t">lg 24 · sections</span><span class="bar" style="width:24px"></span></div>
<div class="r"><span class="t">xl 32</span><span class="bar" style="width:32px"></span></div>
<div class="foot">Reference frame 360dp (Galaxy S21) · card internal padding 12–16 · section eyebrow sits 12 above its card · lists clear the glass bar by 110</div>
</body></html>
