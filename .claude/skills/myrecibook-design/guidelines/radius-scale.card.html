<!-- @dsCard group="Spacing" viewport="700x190" name="Radius scale" subtitle="Pills for anything interactive-primary; 22px squircles for hero icons" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;display:flex;gap:14px;align-items:flex-end;font-family:var(--font-body)}
.b{background:var(--surface-container-lowest);border:1px solid var(--hairline);box-shadow:var(--elev-1);display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.t{font-family:var(--font-mono);font-size:10.5px;color:var(--on-surface-variant);text-align:center;margin-top:6px}
</style></head>
<body>
<div><div class="b" style="width:76px;height:76px;border-radius:8px"></div><div class="t">8 · small inputs,<br>thumbnails</div></div>
<div><div class="b" style="width:76px;height:76px;border-radius:12px"></div><div class="t">12 · THE workhorse—<br>cards, tiles, snackbars</div></div>
<div><div class="b" style="width:76px;height:76px;border-radius:16px"></div><div class="t">16 · feature cards,<br>dialogs (rare)</div></div>
<div><div class="b" style="width:76px;height:76px;border-radius:22px;background:var(--secondary-container);border:none"></div><div class="t">22 · icon<br>squircles (68px)</div></div>
<div><div class="b" style="width:76px;height:76px;border-radius:24px 24px 0 0"></div><div class="t">24 · sheet<br>top corners</div></div>
<div style="flex:1"><div class="b" style="height:48px;border-radius:9999px;background:var(--primary);border:none"></div><div class="t">full · the other workhorse — search, chips, segmented, CTAs, FAB, nav pill. Pill or 12; anything else is a smell</div></div>
</body></html>
