<!-- @dsCard group="Colors" viewport="700x200" name="Surfaces — dark “Midnight”" subtitle="Deep navy, never black; elevation = surface tint, not shadow" -->
<!DOCTYPE html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;font-family:var(--font-body)}
.row{display:flex;gap:8px}
.sw{flex:1;height:96px;border-radius:12px;border:1px solid var(--hairline);padding:8px 10px;display:flex;flex-direction:column;justify-content:space-between}
.n{font-size:11px;font-weight:600;color:var(--on-surface)}.h{font-size:10.5px;color:var(--on-surface-variant);font-family:var(--font-mono)}
.foot{margin-top:10px;font-size:11.5px;color:var(--on-surface-variant)}
</style></head>
<body>
<div class="row">
<div class="sw" style="background:var(--scaffold)"><span class="n">scaffold</span><span class="h">#0F1117</span></div>
<div class="sw" style="background:var(--surface-container-lowest)"><span class="n">lowest</span><span class="h">#0A0C11</span></div>
<div class="sw" style="background:var(--surface-container-low)"><span class="n">low</span><span class="h">#141720</span></div>
<div class="sw" style="background:var(--surface-container)"><span class="n">container · cards</span><span class="h">#161922</span></div>
<div class="sw" style="background:var(--surface-container-high)"><span class="n">high</span><span class="h">#1C1F2B</span></div>
<div class="sw" style="background:var(--surface-container-highest)"><span class="n">highest</span><span class="h">#262A36</span></div>
<div class="sw" style="background:var(--primary)"><span class="n" style="color:var(--on-primary)">primary</span><span class="h" style="color:var(--on-primary)">#BAC3FF lavender</span></div>
</div>
<div class="foot">on-surface #E4E2E6 · outline-variant #454652 · shadows soften to black — depth comes from the lighter-navy tint</div>
</body></html>
