<!-- @dsCard group="Brand" viewport="700x180" name="“Your screenshot” stripes" subtitle="The honest placeholder — user screenshots are the app's only imagery" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;display:flex;gap:14px;font-family:var(--font-body)}
.cell{border-radius:12px;overflow:hidden;border:1px solid var(--hairline);position:relative}
.lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;color:var(--on-surface-variant)}
.cap{flex:1;font-size:12px;color:var(--on-surface-variant);line-height:1.6;align-self:center}
</style></head>
<body>
<div class="cell rb-stripes" style="width:150px;height:150px"><div class="lab">your screenshot</div></div>
<div class="cell rb-stripes" style="width:110px;height:150px"><div class="lab" style="flex-direction:column;gap:6px"><span class="material-symbols-rounded" style="font-size:30px">photo_library</span></div></div>
<div class="cap">45° diagonal stripes (8px bands, secondary-container at 45%/20% over surface) mark every slot where a user's own screenshot will render — covers, heroes, import thumbs.<br><br><strong style="color:var(--on-surface)">Never ship stock artwork in these slots.</strong> The rescued screenshot IS the cover (tier-1, zero effort).</div>
</body></html>
