<!-- @dsCard group="Colors" viewport="700x170" name="Secondary & tertiary" subtitle="Soft indigo everywhere; magenta-pink RESERVED for the ONE-TIME badge + favorite heart" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px 16px;display:flex;gap:10px;font-family:var(--font-body)}
.sw{flex:1;height:132px;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between}
.n{font-size:12.5px;font-weight:600}.h{font-size:11px;opacity:.75;font-family:var(--font-mono)}
.res{flex:1.4;height:132px;border-radius:12px;border:1px solid var(--hairline);background:var(--surface-container-lowest);box-shadow:var(--elev-1);padding:10px 12px;box-sizing:border-box}
.badge{display:inline-block;padding:4px 12px;border-radius:8px;background:var(--tertiary-container);color:var(--on-tertiary-container);font-size:11.5px;font-weight:700;letter-spacing:.3px}
</style></head>
<body>
<div class="sw" style="background:var(--secondary);color:var(--on-secondary)"><span class="n">--secondary</span><span class="h">#4D5A9C</span></div>
<div class="sw" style="background:var(--secondary-container);color:var(--on-secondary-container)"><span class="n">--secondary-container</span><span class="h">#ABB7FF · chips, tints</span></div>
<div class="res">
<div style="font-size:11px;font-weight:600;letter-spacing:.9px;color:var(--on-surface-variant)">TERTIARY — RESERVED</div>
<div style="margin-top:10px;display:flex;gap:10px;align-items:center"><span class="badge">ONE-TIME</span>
<span class="material-symbols-rounded" style="color:var(--tertiary-container);font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24">favorite</span></div>
<div style="margin-top:10px;font-size:12px;color:var(--on-surface-variant);line-height:1.45">Its only two uses in the whole app. Never decorate with it.<br><span class="h">#B40050 / #88003B</span></div>
</div>
</body></html>
