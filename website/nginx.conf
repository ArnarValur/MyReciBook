# Search engines only get the real domain — any staging/run.app host is noindex.
map $host $robots {
  default "noindex, nofollow";
  myrecibook.com "";
  www.myrecibook.com "";
}

# One address per page (2026-09-17): https://myrecibook.com/path — no www,
# no trailing slash, no index.html, English only while i18n is paused.
# Every redirect below lands on that address in ONE hop. A staging host
# redirects onto itself so a run.app preview stays a preview.
map $host $origin {
  default            "https://$host";
  myrecibook.com     "https://myrecibook.com";
  www.myrecibook.com "https://myrecibook.com";
}

server {
  listen 8080;
  add_header X-Robots-Tag $robots;
  root /usr/share/nginx/html;
  index index.html;

  # ── Redirects: every other spelling → the canonical address, no chains ──
  # Order matters: the locale rule comes first so /is/ never bounces through
  # /is on its way to /.

  # Non-English copies are not published while i18n is paused (market
  # Decision 2, 2026-09-01; only English is built — nuxt.config.ts liveLocales).
  # /is, /is/, /is/privacy, /is/privacy/index.html → the English page.
  # Drop a code from this list the day that language goes live.
  location ~ ^/(?:is|sv|nb|da|fi|fo)(?:/|$) {
    rewrite ^/(?:is|sv|nb|da|fi|fo)/?(.*?)/?(?:index\.html)?$ $origin/$1 permanent;
  }

  # The sitemap was an index split per language until 2026-09-17; the old
  # addresses (robots.txt and Search Console knew them) point at the flat one.
  location ~ ^/(?:sitemap_index\.xml|__sitemap__/[a-z][a-z]\.xml)$ {
    return 301 $origin/sitemap.xml;
  }

  # /index.html → /
  location = /index.html {
    return 301 $origin/$is_args$args;
  }

  # /privacy/ and /privacy/index.html → /privacy
  location ~ ^(.+)/(?:index\.html)?$ {
    return 301 $origin$1$is_args$args;
  }

  # The Nuxt fallback shells are not pages — never index them.
  location ~ ^/(?:200|404)\.html$ {
    add_header X-Robots-Tag "noindex, nofollow";
  }

  # Hashed build assets cache forever; pages revalidate
  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location ~* \.(webp|png|svg|ttf)$ {
    add_header Cache-Control "public, max-age=604800";
  }

  # Pretty URLs: /privacy -> /privacy/index.html; unknown -> the 404 card
  error_page 404 /404.html;
  location / {
    # www serves the same site — send it to the bare domain. Only canonical-
    # shaped paths reach this block, so this is never the second hop of a chain.
    if ($host = www.myrecibook.com) {
      return 301 https://myrecibook.com$request_uri;
    }
    try_files $uri $uri/index.html $uri.html =404;
  }

  gzip on;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;
}
