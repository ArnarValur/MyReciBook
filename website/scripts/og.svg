<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- kraft box -->
  <rect width="1200" height="630" fill="#efe4cd"/>
  <!-- scattered card behind -->
  <g transform="rotate(-7 180 120)">
    <rect x="60" y="60" width="240" height="150" rx="6" fill="#f7efe0" stroke="#c9b490" stroke-width="1.5"/>
    <g stroke="#3f51b5" stroke-opacity="0.18" stroke-width="1.5">
      <line x1="76" y1="98" x2="284" y2="98"/><line x1="76" y1="126" x2="284" y2="126"/>
      <line x1="76" y1="154" x2="284" y2="154"/><line x1="76" y1="182" x2="284" y2="182"/>
    </g>
  </g>
  <!-- the hero index card -->
  <g transform="rotate(-1.2 600 330)">
    <rect x="120" y="120" width="960" height="420" rx="10" fill="#fffdf8" stroke="#cdb896" stroke-width="1.5"/>
    <!-- ruled lines -->
    <g stroke="#3f51b5" stroke-opacity="0.10" stroke-width="1.5">
      <line x1="140" y1="240" x2="1060" y2="240"/><line x1="140" y1="288" x2="1060" y2="288"/>
      <line x1="140" y1="336" x2="1060" y2="336"/><line x1="140" y1="384" x2="1060" y2="384"/>
      <line x1="140" y1="432" x2="1060" y2="432"/><line x1="140" y1="480" x2="1060" y2="480"/>
    </g>
    <!-- red margin -->
    <line x1="188" y1="122" x2="188" y2="538" stroke="#ba1a1a" stroke-opacity="0.25" stroke-width="2"/>
    <!-- header -->
    <text x="216" y="188" font-family="monospace" font-size="19" letter-spacing="3" fill="#ba1a1a" fill-opacity="0.65">RECIPE Nº 001</text>
    <text x="470" y="188" font-family="Inter" font-weight="600" font-size="16" letter-spacing="1.5" fill="#454652" fill-opacity="0.6">FROM THE KITCHEN OF · YOU</text>
    <!-- title -->
    <text x="212" y="290" font-family="Plus Jakarta Sans" font-weight="800" font-size="58" letter-spacing="-1" fill="#1a1c1e">Rescue the recipes buried</text>
    <text x="212" y="360" font-family="Plus Jakarta Sans" font-weight="800" font-size="58" letter-spacing="-1" fill="#1a1c1e">in your <tspan fill="#24389c">camera roll.</tspan></text>
    <line x1="418" y1="374" x2="736" y2="374" stroke="#3f51b5" stroke-opacity="0.35" stroke-width="5"/>
    <!-- sub -->
    <text x="214" y="428" font-family="Inter" font-size="24" fill="#454652">Screenshots, links and grandma's cards become</text>
    <text x="214" y="462" font-family="Inter" font-size="24" fill="#454652">a cookbook you own. On your Android phone.</text>
    <!-- wordmark -->
    <g transform="translate(214 492) scale(0.32)">
      <path d="M54 60 C47 53 36 51 26 53 L26 72 C36 70 47 72 54 78 C61 72 72 70 82 72 L82 53 C72 51 61 53 54 60 Z" fill="#24389c"/>
      <path d="M45 26 c-5 7 5 9 0 16" stroke="#24389c" stroke-width="6" stroke-linecap="round" fill="none"/>
      <path d="M63 26 c-5 7 5 9 0 16" stroke="#24389c" stroke-width="6" stroke-linecap="round" fill="none"/>
    </g>
    <text x="252" y="518" font-family="Plus Jakarta Sans" font-weight="800" font-size="26" letter-spacing="-0.5" fill="#24389c">MyReciBook</text>
    <text x="880" y="518" font-family="Inter" font-size="17" fill="#454652" fill-opacity="0.7">myrecibook.com</text>
    <!-- stamp -->
    <g transform="rotate(8 950 200)">
      <rect x="860" y="160" width="190" height="82" rx="8" fill="none" stroke="#3f51b5" stroke-opacity="0.45" stroke-width="4"/>
      <text x="955" y="197" font-family="monospace" font-size="19" letter-spacing="3" fill="#3f51b5" fill-opacity="0.6" text-anchor="middle">PAY ONCE</text>
      <text x="955" y="224" font-family="monospace" font-size="19" letter-spacing="3" fill="#3f51b5" fill-opacity="0.6" text-anchor="middle">COOK FOREVER</text>
    </g>
    <!-- tape -->
    <g transform="rotate(-38 150 130)">
      <rect x="96" y="116" width="110" height="30" fill="#ffffff" fill-opacity="0.55" stroke="#c9b490" stroke-width="1" stroke-dasharray="4 3"/>
    </g>
  </g>
</svg>
